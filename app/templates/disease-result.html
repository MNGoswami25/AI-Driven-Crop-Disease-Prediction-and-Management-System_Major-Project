{% extends 'layout.html' %}
{% block body %}

<style>
  /* Make body and html full height */
  html, body {
    height: 60%;
    margin: 0;
  }

  /* Full screen container with flex centering */
  .full-screen-container {
    min-height: 60vh; /* full viewport height */
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #fffbe6; /* keep your card bg */
    padding: 20px;
  }

  /* Make the card take more width, no max width */
  .card {
    width: 60%;
    max-width: none; /* remove Bootstrap max-width */
    border-radius: 0; /* optional, remove rounded corners if you want */
    box-shadow: none; /* optional: remove shadow */
  }

  .card-body {
    padding: 40px;
    text-align: center;
  }

  /* Optional: adjust font size for full screen */
  .card-text {
    font-size: 1.25rem;
    color: #333;
  }
</style>

<div class="full-screen-container">
  <div class="card shadow-lg rounded-4 border-0">
    <div class="card-body">
      <h2 class="card-title mb-4" style="color: #2c3e50;">🌿 Prediction Result</h2>

      <p class="card-text fs-5 fw-semibold">
        {{ prediction }}
      </p>

      <a href="{{ url_for('disease_prediction') }}" class="btn btn-success mt-4 rounded-pill px-4 py-2">
        Try Another Image
      </a>
    </div>
  </div>
</div>

{% endblock %}
